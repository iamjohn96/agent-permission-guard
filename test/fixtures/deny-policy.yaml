version: 1
rules:
  - id: deny-dangerous-write
    priority: 100
    match: { server: local-upstream, tools: [dangerous_write] }
    decision: deny
  - id: allow-fixture-observation
    priority: 50
    match: { server: local-upstream, tools: [get_dangerous_call_count] }
    decision: allow
    risk_tags: [local_read]
